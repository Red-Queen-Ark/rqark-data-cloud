services:
  pgsql:
    image: postgres:16
    container_name: ${PROJECT_NAME}-pgsql
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
    env_file:
      - ./.env
    volumes:
      - db_data:/var/lib/postgresql/data/pgdata
    networks:
      - rqark-project
    restart: unless-stopped

  redis:
    image: redis:6
    container_name: ${PROJECT_NAME}-redis
    volumes:
      - redis_data:/data
    networks:
      - rqark-project
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: docker/dockerfile
    container_name: ${PROJECT_NAME}-server
    environment:
      - POSTGRES_SERVER=pgsql
      - REDIS_SERVER=redis
    env_file:
      - ./.env
    depends_on:
      - pgsql
      - redis
    networks:
      - rqark-project
    restart: unless-stopped

volumes:
  db_data:
    name: ${PROJECT_NAME}-db-data
  redis_data:
    name: ${PROJECT_NAME}-redis-data

networks:
  rqark-project:
    name: rqark-project
    external: true