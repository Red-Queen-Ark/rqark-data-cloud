name: Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: carhyme-gitea-runner
    steps:
      - uses: actions/checkout@v4
      - name: Deploy containers
        run: |
          export VERSION=$(git describe --tags --exact-match 2>/dev/null || git rev-parse --short HEAD)
          docker compose -f docker-compose.production.yml up -d --build