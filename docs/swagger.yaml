        type: string
    type: object
  api.TokenPair:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      refresh_token:
        example: 9f2c1a1b1c1d1e1f1a1b1c1d1e1f1a1b
        type: string
    type: object
  api.UpdateAPIKeyRequest:
    properties:
      expires_at:
        type: string
      is_active:
        type: boolean
      name:
        type: string
    type: object
  api.UpdateAgentRequest:
    properties:
      description:
        type: string
      name:
        type: string
      prompts:
        items:
          $ref: '#/definitions/repository.AgentPrompt'
        type: array
      tools:
        items:
          $ref: '#/definitions/repository.AgentTool'
        type: array
    type: object
  api.UpdateGroupRequest:
    properties:
      name:
        type: string
    type: object
  api.UpdateMeRequest:
    properties:
      display_name:
        type: string
      email:
        type: string
      is_superuser:
        type: boolean
