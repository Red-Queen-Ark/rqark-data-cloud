      id:
        example: 7d1e4c2a-1a1a-4a1a-8a1a-1a1a1a1a1a1a
        type: string
      model_name:
        example: deepseek-v4-pro
        type: string
      name:
        example: deepseek-v4-pro
        type: string
      presence_penalty:
        example: 0.5
        type: number
      priority:
        example: 1
        type: integer
      reasoning_effort:
        example: high
        type: string
      seed:
        example: 42
        type: integer
      temperature:
        example: 0.7
        type: number
      thinking:
        example: enabled
