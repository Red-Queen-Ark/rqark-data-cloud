        type: string
    type: object
  api.UserDTO:
    properties:
      created_at:
        type: string
      display_name:
        example: Boss
        type: string
      email:
        example: boss@example.com
        type: string
      id:
        example: 3f1a5c1e-1a1a-4a1a-8a1a-1a1a1a1a1a1a
        type: string
      is_active:
        example: true
        type: boolean
      is_staff:
        example: false
        type: boolean
      is_superuser:
        example: true
        type: boolean
      updated_at:
        type: string
      username:
        example: boss
        type: string
    type: object
  repository.AgentPrompt:
    properties:
      name:
        type: string
      params:
        additionalProperties: {}
        type: object
    type: object
  repository.AgentTool:
    properties:
      name:
        type: string
      params:
        additionalProperties: {}
        type: object
    type: object
  repository.SessionPlanItem:
    properties:
      content:
        type: string
      id:
        type: string
      status:
        type: string
    type: object
  utils.Code:
    enum:
    - UNAUTHORIZED
    - FORBIDDEN
    - BAD_REQUEST
    - NOT_FOUND
    - CONFLICT
    - LAST_SUPERUSER
    - INTERNAL
    type: string
    x-enum-varnames:
    - Unauthorized
    - Forbidden
    - BadRequest
    - NotFound
    - Conflict
    - LastSuperuser
    - Internal
  utils.Error:
    properties:
      code:
        allOf:
        - $ref: '#/definitions/utils.Code'
        example: UNAUTHORIZED
      message:
        example: Invalid username or password
        type: string
    type: object
  utils.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/utils.Error'
    type: object
  utils.Page-api_APIKeyDTO:
    properties:
      items:
        items:
          $ref: '#/definitions/api.APIKeyDTO'
        type: array
      limit:
        example: 20
        type: integer
      offset:
        example: 0
        type: integer
      total:
        example: 128
        type: integer
    type: object
  utils.Page-api_GroupDTO:
    properties:
      items:
        items:
          $ref: '#/definitions/api.GroupDTO'
        type: array
      limit:
        example: 20
        type: integer
      offset:
        example: 0
        type: integer
      total:
        example: 128
        type: integer
    type: object
  utils.Page-api_UserDTO:
    properties:
      items:
        items:
          $ref: '#/definitions/api.UserDTO'
        type: array
      limit:
        example: 20
        type: integer
      offset:
        example: 0
        type: integer
      total:
        example: 128
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: Data cloud API.
  title: rqark-data-cloud
  version: "1.0"
paths:
  /agents:
    get:
      description: 'Returns all of the caller''s agents, ordered by name. Not paginated:
        a user has few of them.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.AgentDTO'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List agents
      tags:
      - agents
    post:
      consumes:
      - application/json
      description: The agent belongs to the caller. Answers 201 with a Location header
        pointing at the new agent.
      parameters:
      - description: Agent to create
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.CreateAgentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: URL of the created agent
              type: string
          schema:
            $ref: '#/definitions/api.AgentDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create an agent
      tags:
      - agents
  /agents/{uuid}:
    delete:
      description: Hard delete of one of the caller's agents. Another user's agent
        is reported as 404.
      parameters:
      - description: Agent ID
        format: uuid
        in: path
        name: uuid
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete an agent
      tags:
      - agents
    get:
      description: Returns one of the caller's agents. Another user's agent is reported
        as 404.
      parameters:
      - description: Agent ID
        format: uuid
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.AgentDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get an agent
      tags:
      - agents
    put:
      consumes:
      - application/json
      description: Every field is optional and a field that is absent is left untouched.
        Another user's agent is reported as 404.
      parameters:
      - description: Agent ID
        format: uuid
        in: path
        name: uuid
        required: true
        type: string
      - description: Fields to change
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.UpdateAgentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.AgentDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update an agent
      tags:
      - agents
  /api-keys:
    get:
      description: 'Returns the caller''s keys, newest first. The keys themselves
        are not part of the response: only the prefix each was created with.'
      parameters:
      - description: Page size (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: Number of keys to skip
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Page-api_APIKeyDTO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List API keys
      tags:
      - api-keys
    post:
      consumes:
      - application/json
      description: The key belongs to the caller. The response is the only place the
        key itself is ever returned; only its hash is stored, so a lost key cannot
        be recovered, only replaced.
      parameters:
      - description: Key to create
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.CreateAPIKeyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: URL of the created key
              type: string
          schema:
            $ref: '#/definitions/api.APIKeyDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create an API key
      tags:
      - api-keys
  /api-keys/{uuid}:
    delete:
      description: 'Soft delete: the key stops authenticating at once, is left out
        of the listing, and the row stays behind for audit with the time and the reason.
        Another user''s key is reported as 404, and deleting a deleted key is a no-op.'
      parameters:
      - description: API key ID
        format: uuid
        in: path
        name: uuid
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete an API key
      tags:
      - api-keys
    patch:
      consumes:
      - application/json
      description: 'A field that is absent keeps its stored value. Setting expires_at
        is also how a lapsed key is renewed: the key is then active and usable again,
        and null makes it never expire. Switching a lapsed key on without moving its
        expiry is refused. A key that was deleted is hidden and cannot be updated.
        Another user''s key is reported as 404.'
      parameters:
      - description: API key ID
        format: uuid
        in: path
        name: uuid
        required: true
        type: string
      - description: Fields to change
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.UpdateAPIKeyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIKeyDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update an API key
      tags:
      - api-keys
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Answers 204 whether or not the email exists, so the endpoint cannot
        be used to enumerate accounts. A reset link is generated for an existing active
        account only.
      parameters:
      - description: Email address
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.ForgotPasswordRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Request a password reset
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Accepts a username or an email as login. A wrong password, an unknown
        account and a deactivated account all answer 401 with the same body.
      parameters:
      - description: Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.TokenPair'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Log in
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Consumes the refresh token and returns a new pair. The old token
        cannot be used again.
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.TokenPair'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Refresh a token pair
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates an ordinary user and returns it. No token is issued; the
        caller logs in afterwards.
      parameters:
      - description: Account to create
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
