  api.ForgotPasswordRequest:
    properties:
      email:
        example: boss@example.com
        type: string
    type: object
  api.GroupDTO:
    properties:
      created_at:
        type: string
      id:
        example: 9b2f5c1e-1a1a-4a1a-8a1a-1a1a1a1a1a1a
        type: string
      name:
        example: engineering
        type: string
      updated_at:
        type: string
    type: object
  api.LoginRequest:
    properties:
      login:
        example: boss@example.com
        type: string
      password:
        example: correct-horse-battery
        type: string
    type: object
  api.MessageResponse:
    properties:
      message:
        example: Password updated.
        type: string
    type: object
  api.PingResponse:
    properties:
      message:
        example: pong
        type: string
    type: object
  api.ProviderDTO:
    properties:
      api_base:
        example: https://api.deepseek.com/v1
