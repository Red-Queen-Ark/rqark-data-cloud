  api.ResetPasswordRequest:
    properties:
      new_password:
        example: staple-correct-battery
        type: string
      token:
        example: 9f2c1a1b1c1d1e1f1a1b1c1d1e1f1a1b
        type: string
    type: object
  api.SessionDTO:
    properties:
      created_at:
        type: string
      id:
        example: 6b1c1f3a-1a1a-4a1a-8a1a-1a1a1a1a1a1a
        type: string
      plan_items:
        items:
          $ref: '#/definitions/repository.SessionPlanItem'
        type: array
      title:
