        then id descending. agent_id narrows the page to one agent the caller may
        use, its own or a public one; leaving it out covers every agent. The page
        continues from cursor, which is the next_cursor of the previous response.
        Rows are not ordered by score: score depends on now(), so a cursor built from
        it would drift and repeat or skip rows between pages.'
      parameters:
      - description: Agent ID
        format: uuid
        in: query
        name: agent_id
        type: string
