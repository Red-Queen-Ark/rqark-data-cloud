        example: 7d1e4c2a-1a1a-4a1a-8a1a-1a1a1a1a1a1a
        type: string
      reasoning_effort:
        example: high
        type: string
      stream:
        description: |-
          Stream asks the provider for a server-sent event stream. The events are
