    x-enum-varnames:
    - Unauthorized
    - Forbidden
    - BadRequest
    - NotFound
    - Conflict
    - InvalidContent
    - ImmutableField
    - PinnedLimit
    - StateConflict
    - AgentAmbiguous
    - ProviderAmbiguous
    - LastSuperuser
    - BadGateway
    - Internal
  utils.Error:
    properties:
      code:
        allOf:
        - $ref: '#/definitions/utils.Code'
        example: UNAUTHORIZED
      message:
        example: Invalid username or password
        type: string
    type: object
  utils.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/utils.Error'
    type: object
  utils.Page-api_APIKeyDTO:
    properties:
      items:
        items:
          $ref: '#/definitions/api.APIKeyDTO'
        type: array
      limit:
        example: 20
        type: integer
      offset:
        example: 0
        type: integer
      total:
        example: 128
        type: integer
    type: object
  utils.Page-api_GroupDTO:
    properties:
      items:
        items:
          $ref: '#/definitions/api.GroupDTO'
        type: array
      limit:
        example: 20
        type: integer
      offset:
        example: 0
        type: integer
      total:
        example: 128
        type: integer
    type: object
  utils.Page-api_TaskRunDTO:
    properties:
      items:
        items:
          $ref: '#/definitions/api.TaskRunDTO'
        type: array
      limit:
        example: 20
        type: integer
      offset:
        example: 0
        type: integer
      total:
        example: 128
        type: integer
    type: object
  utils.Page-api_UserDTO:
    properties:
      items:
        items:
          $ref: '#/definitions/api.UserDTO'
        type: array
      limit:
        example: 20
        type: integer
      offset:
        example: 0
        type: integer
      total:
        example: 128
        type: integer
    type: object
info:
  contact: {}
  description: Data cloud API.
  title: rqark-data-cloud
  version: "1.0"
paths:
  /agent-defaults:
    get:
      description: 'Returns all of the caller''s default agents, ordered by source.
        Not paginated: a user names one source per client it runs and the app wants
        the whole set at once.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.AgentDefaultDTO'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List agent defaults
      tags:
      - agent-defaults
  /agent-defaults/{source}:
    delete:
      description: Hard delete of the caller's default agent for one source. A source
        that has no default is reported as 404.
      parameters:
      - description: Session source
        example: TUI
        in: path
        name: source
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a default agent
      tags:
      - agent-defaults
    get:
      description: Returns the caller's default agent for one source. A source that
        holds no default is reported as 404.
      parameters:
      - description: Session source
        example: TUI
        in: path
        name: source
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.AgentDefaultDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a default agent
      tags:
      - agent-defaults
    put:
      consumes:
      - application/json
      description: 'Upserts the caller''s default agent for one source: the agent
        of an existing source is overwritten, a source that does not exist is created.
        The agent has to be one the caller may use: its own, or one another user shares.'
      parameters:
      - description: Session source
        example: TUI
        in: path
        name: source
        required: true
        type: string
      - description: Default agent to set
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.PutAgentDefaultRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.AgentDefaultDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Set a default agent
      tags:
      - agent-defaults
  /agents:
    get:
      description: 'Returns the caller''s own agents plus every agent another user
        shares, ordered by name. A shared agent carries `is_public` true and `owned`
        false, and cannot be changed by anyone but its owner. Not paginated: a user
        has few of them.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.AgentDTO'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List agents
      tags:
      - agents
    post:
      consumes:
      - application/json
      description: The agent belongs to the caller. `is_public` shares it with every
        other user and is reserved to superusers. Answers 201 with a Location header
        pointing at the new agent.
      parameters:
      - description: Agent to create
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.CreateAgentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: URL of the created agent
              type: string
          schema:
            $ref: '#/definitions/api.AgentDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create an agent
      tags:
      - agents
  /agents/{uuid}:
    delete:
      description: Hard delete of one of the caller's agents. Another user's agent
        is reported as 404.
      parameters:
      - description: Agent ID
        format: uuid
        in: path
        name: uuid
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete an agent
      tags:
      - agents
    get:
      description: 'Returns an agent the caller may use: one it owns, or one another
        user shares. An agent the caller may not use is reported as 404.'
      parameters:
      - description: Agent ID
        format: uuid
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.AgentDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get an agent
      tags:
      - agents
    put:
      consumes:
      - application/json
      description: Every field is optional and a field that is absent is left untouched.
        `is_public` shares the agent with every other user and is reserved to superusers.
        Another user's agent is reported as 404, so only the owner changes a shared
        one.
      parameters:
      - description: Agent ID
        format: uuid
        in: path
        name: uuid
        required: true
        type: string
      - description: Fields to change
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.UpdateAgentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.AgentDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update an agent
      tags:
      - agents
  /agents/names:
    get:
      description: 'Returns the id and name of the caller''s own agents plus the ones
        other users share, ordered by name then id. The rest of each agent is left
        out. Not paginated: a user has few of them.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/repository.AgentName'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List agent names
      tags:
      - agents
  /api-keys:
    get:
      description: 'Returns the caller''s keys, newest first. The keys themselves
        are not part of the response: only the prefix each was created with.'
      parameters:
      - description: Page size (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: Number of keys to skip
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Page-api_APIKeyDTO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List API keys
      tags:
      - api-keys
    post:
      consumes:
      - application/json
      description: The key belongs to the caller. The response is the only place the
        key itself is ever returned; only its hash is stored, so a lost key cannot
        be recovered, only replaced.
      parameters:
      - description: Key to create
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.CreateAPIKeyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: URL of the created key
              type: string
          schema:
            $ref: '#/definitions/api.APIKeyDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create an API key
      tags:
      - api-keys
  /api-keys/{uuid}:
    delete:
      description: 'Soft delete: the key stops authenticating at once, is left out
        of the listing, and the row stays behind for audit with the time and the reason.
        Another user''s key is reported as 404, and deleting a deleted key is a no-op.'
      parameters:
      - description: API key ID
        format: uuid
        in: path
        name: uuid
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete an API key
      tags:
      - api-keys
    patch:
      consumes:
      - application/json
      description: 'A field that is absent keeps its stored value. Setting expires_at
        is also how a lapsed key is renewed: the key is then active and usable again,
        and null makes it never expire. Switching a lapsed key on without moving its
        expiry is refused. A key that was deleted is hidden and cannot be updated.
        Another user''s key is reported as 404.'
      parameters:
      - description: API key ID
        format: uuid
        in: path
        name: uuid
        required: true
        type: string
      - description: Fields to change
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.UpdateAPIKeyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIKeyDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update an API key
      tags:
      - api-keys
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Answers 204 whether or not the email exists, so the endpoint cannot
        be used to enumerate accounts. A reset link is generated for an existing active
        account only.
      parameters:
      - description: Email address
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.ForgotPasswordRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Request a password reset
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Accepts a username or an email as login. A wrong password, an unknown
        account and a deactivated account all answer 401 with the same body.
      parameters:
      - description: Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.TokenPair'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Log in
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Consumes the refresh token and returns a new pair. The old token
        cannot be used again.
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.TokenPair'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Refresh a token pair
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates an ordinary user and returns it. No token is issued; the
        caller logs in afterwards.
      parameters:
      - description: Account to create
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.UserDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Register
      tags:
      - auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Consumes the reset token and stores the new password. An unknown,
        expired or already used token answers 400 with the same body. No refresh token
        is revoked.
      parameters:
      - description: Reset token and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Reset a password
      tags:
      - auth
  /chat:
    post:
      consumes:
      - application/json
      description: Forwards an OpenAI chat completion to the provider named by provider_id
        and relays the provider's response as it arrives, including a server-sent
        event stream when stream is true. The provider's api_key is added server-side.
        The provider's status, headers and body are returned unchanged, so an upstream
        401 or 429 reaches the caller as it was sent.
      parameters:
      - description: OpenAI chat completion body, plus provider_id
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.ChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Chat through a stored provider
      tags:
      - chat
  /chat/{uuid}/chat/completions:
    post:
      consumes:
      - application/json
      description: Same as POST /chat, except the provider is named by the path and
        the body carries no provider_id. It exists so an OpenAI client can reach the
        proxy by setting base_url to /api/chat/{uuid} and its api_key to a data cloud
        token.
      parameters:
      - description: Provider ID
        in: path
        name: uuid
        required: true
        type: string
      - description: OpenAI chat completion body
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Chat through a stored provider, addressed by path
      tags:
      - chat
  /groups:
    get:
      description: Requires a bearer token. Returns groups only, never their members.
      parameters:
      - description: Page size (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: Number of groups to skip
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Page-api_GroupDTO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List groups
      tags:
      - groups
    post:
      consumes:
      - application/json
      description: Superuser only. Answers 201 with a Location header pointing at
        the new group.
      parameters:
      - description: Group to create
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.CreateGroupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: URL of the created group
              type: string
          schema:
            $ref: '#/definitions/api.GroupDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a group
      tags:
      - groups
  /groups/{uuid}:
    delete:
      description: 'Superuser only. Hard delete: the group and its memberships are
        removed.'
      parameters:
      - description: Group ID
        format: uuid
        in: path
        name: uuid
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
