basePath: /api
definitions:
  api.APIKeyDTO:
    properties:
      created_at:
        type: string
      expires_at:
        type: string
      id:
        example: 3f9a1c7e-1a1a-4a1a-8a1a-1a1a1a1a1a1a
        type: string
      is_active:
        example: true
        type: boolean
      key:
        description: |-
          Key is the plaintext key. Only the create response carries it: that is
          the single moment the key exists outside its owner's hands.
        example: rqark-9Zk2Xf1pZ1pZ1pZ1pZ1pZ1pZ1pZ1pZ1pZ1pZ1p
        type: string
      key_prefix:
        example: rqark-9Zk2Xf1p
        type: string
      last_used_at:
        type: string
      name:
        example: laptop
        type: string
      revoked_at:
        type: string
      revoked_message:
        example: user_deleted
        type: string
      updated_at:
        type: string
    type: object
  api.AgentDTO:
    properties:
      created_at:
        type: string
      description:
        example: ""
        type: string
      id:
        example: 5c9d3b1e-1a1a-4a1a-8a1a-1a1a1a1a1a1a
        type: string
      name:
        example: Angel Holiday
        type: string
      prompts:
        items:
          $ref: '#/definitions/repository.AgentPrompt'
        type: array
      tools:
        items:
          $ref: '#/definitions/repository.AgentTool'
        type: array
      updated_at:
        type: string
    type: object
  api.ChangePasswordRequest:
    properties:
      new_password:
        example: staple-correct-battery
        type: string
      old_password:
        example: correct-horse-battery
        type: string
    type: object
  api.CreateAPIKeyRequest:
    properties:
      expires_at:
        type: string
      name:
        example: laptop
        type: string
    type: object
  api.CreateAgentRequest:
    properties:
      description:
        type: string
      name:
        example: Angel Holiday
        type: string
      prompts:
        items:
          $ref: '#/definitions/repository.AgentPrompt'
        type: array
      tools:
        items:
          $ref: '#/definitions/repository.AgentTool'
        type: array
    type: object
  api.CreateGroupRequest:
    properties:
      name:
        example: engineering
        type: string
    type: object
  api.CreateProviderRequest:
    properties:
      api_base:
        example: https://api.deepseek.com/v1
        type: string
      api_key:
        example: sk-rqark-0000
        type: string
      combine:
        example: false
        type: boolean
      frequency_penalty:
        example: 0.5
        type: number
      model_name:
        example: deepseek-v4-pro
        type: string
      name:
        example: deepseek-v4-pro
        type: string
      presence_penalty:
        example: 0.5
        type: number
      priority:
        example: 1
        type: integer
      reasoning_effort:
        example: high
        type: string
      seed:
        example: 42
        type: integer
      temperature:
        example: 0.7
        type: number
      thinking:
        example: enabled
        type: string
      top_p:
        example: 0.9
        type: number
    type: object
  api.CreateSessionRequest:
    properties:
      plan_items:
        items:
          $ref: '#/definitions/repository.SessionPlanItem'
        type: array
      title:
        example: Trip planning
        type: string
      uuid:
        example: 6b1c1f3a-1a1a-4a1a-8a1a-1a1a1a1a1a1a
        type: string
