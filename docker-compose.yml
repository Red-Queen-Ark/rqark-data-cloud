services:
  pgsql:
    image: postgres:16
    container_name: ${PROJECT_NAME}-pgsql
    ports:
      - 5432:5432
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    env_file:
      - ./envs/.env
    volumes:
      - db_data:/var/lib/postgresql/data/pgdata
    restart: unless-stopped
    
  redis:
    image: redis:6
    container_name: ${PROJECT_NAME}-redis
    restart: unless-stopped

volumes:
  db_data:
    name: ${PROJECT_NAME}-db-data