services:
  pgsql:
    image: postgres:16
    container_name: ${PROJECT_NAME}-pgsql
    ports:
      - 127.0.0.1:5432:5432
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_SERVER=localhost
    env_file:
      - ./.env
    volumes:
      - db_data:/var/lib/postgresql/data/pgdata
    restart: unless-stopped
    
  redis:
    image: redis:6
    container_name: ${PROJECT_NAME}-redis
    ports:
      - 127.0.0.1:6379:6379
    environment:
      - REDIS_SERVER=redis
    volumes:
      - redis_data:/data
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: docker/dockerfile
    container_name: ${PROJECT_NAME}-server
    ports:
      - 127.0.0.1:${PORT}:${PORT}
    environment:
      - POSTGRES_SERVER=pgsql
      - REDIS_SERVER=redis
    env_file:
      - ./.env
    depends_on:
      - pgsql
      - redis
    restart: unless-stopped

volumes:
  db_data:
    name: ${PROJECT_NAME}-db-data
  redis_data:
    name: ${PROJECT_NAME}-redis-data